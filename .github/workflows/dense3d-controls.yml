name: Bounded dense3D producer metadata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scoped-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select existing pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Native small-fixture ownership and controls
        run: |
          cargo test --locked --no-default-features --test dense3d_controls_contract
          cargo test --locked --no-default-features --test dense3d_sequence_contract -- --skip nine_frames_round_trip_every_accepted_native_bit_and_decimal_u64_stamp
          cargo clippy --locked --no-default-features --example dense3d_sequence --test dense3d_controls_contract --test dense3d_sequence_contract -- -D warnings
      - name: Original v1 and proposed-v2 static contracts
        run: |
          python3 -m unittest discover -s tools -p 'test_dense3d*.py'
          python3 -O -m unittest discover -s tools -p 'test_dense3d*.py'
