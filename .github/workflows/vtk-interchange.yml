name: Native VTK interchange
on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/vtk_export_fixture.rs'
      - 'examples/session_support/**'
      - 'tests/vtk_export_contract.rs'
      - 'tools/test_vtk_roundtrip.py'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/vtk-interchange.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/vtk_export_fixture.rs'
      - 'examples/session_support/**'
      - 'tests/vtk_export_contract.rs'
      - 'tools/test_vtk_roundtrip.py'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/vtk-interchange.yml'
permissions:
  contents: read
jobs:
  vtk-reader-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Install qualified independent VTK reader
        run: |
          python3 -m venv "$RUNNER_TEMP/vtk-reader"
          "$RUNNER_TEMP/vtk-reader/bin/pip" install vtk==9.3.1 numpy==2.3.5
      - name: Rust boundary contract and static checks
        run: |
          cargo test --locked --no-default-features --test vtk_export_contract
          cargo clippy --locked --no-default-features --test vtk_export_contract --example vtk_export_fixture -- -D warnings
      - name: Real VTK reader validates native precision and associations
        run: |
          cargo run --locked --no-default-features --example vtk_export_fixture -- "$RUNNER_TEMP/rheon-vtk-fixtures"
          "$RUNNER_TEMP/vtk-reader/bin/python" tools/test_vtk_roundtrip.py "$RUNNER_TEMP/rheon-vtk-fixtures"
