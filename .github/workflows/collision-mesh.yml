name: Static collision mesh evidence
on:
  pull_request:
    paths:
      - 'src/mesh_*.rs'
      - 'src/particle_fluid.rs'
      - 'tests/mesh_*'
      - 'tests/fixtures/collision/**'
      - 'examples/collision_mesh.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/collision-mesh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-workloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Analytical and import contracts
        run: |
          cargo test --locked --release --no-default-features --test mesh_import_contract --test mesh_collision_contract
          cargo test --locked --release --no-default-features --lib particle_fluid::physics_tests
      - name: Real imported water and air stepping and CPU profile
        run: |
          mkdir -p "$RUNNER_TEMP/collision-evidence"
          cargo run --locked --release --example collision_mesh -- tests/fixtures/collision/domain-box.obj solid water > "$RUNNER_TEMP/collision-evidence/water.txt"
          cargo run --locked --release --example collision_mesh -- tests/fixtures/collision/domain-box.obj solid air > "$RUNNER_TEMP/collision-evidence/air.txt"
          lscpu > "$RUNNER_TEMP/collision-evidence/cpu.txt"
          cargo run --locked --release --example collision_mesh -- --profile > "$RUNNER_TEMP/collision-evidence/profile.csv"
      - name: Native software-rendered import smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0
          cargo build --locked --release --features desktop --bin rheon-desktop
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1250x820x24' bash <<'SH'
          set -eu
          target/release/rheon-desktop --collision-mesh tests/fixtures/collision/domain-box.obj --collision-policy solid --collision-run > "$RUNNER_TEMP/collision-evidence/native.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          window=''
          for attempt in $(seq 1 30); do
            if ! kill -0 "$app_pid" 2>/dev/null; then cat "$RUNNER_TEMP/collision-evidence/native.log"; exit 1; fi
            window=$(xdotool search --onlyvisible --name 'Rheon / Live 3D' | head -n 1 || true)
            if test -n "$window"; then break; fi
            sleep 1
          done
          test -n "$window"
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then cat "$RUNNER_TEMP/collision-evidence/native.log"; exit 1; fi
          import -window "$window" "$RUNNER_TEMP/collision-evidence/native-import.png"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collision-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/collision-evidence/
          if-no-files-found: error
          retention-days: 14
