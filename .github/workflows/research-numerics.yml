name: Rheon research numerics
on:
  pull_request:
    paths:
      - 'docs/research-book/companion/**'
      - '.github/workflows/research-numerics.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research-book/companion/**'
      - '.github/workflows/research-numerics.yml'
permissions:
  contents: read
jobs:
  reference-mechanisms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create isolated reference environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/rheon-reference"
          "$RUNNER_TEMP/rheon-reference/bin/python" -m pip install -r docs/research-book/companion/requirements.txt
      - name: Execute restricted numerical fixtures
        run: |
          "$RUNNER_TEMP/rheon-reference/bin/python" docs/research-book/companion/experiments.py
          "$RUNNER_TEMP/rheon-reference/bin/python" docs/research-book/companion/depth_experiments.py
