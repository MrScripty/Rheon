[package]
name = "rheon-browser-solver"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
name = "rheon_solver"
crate-type = ["cdylib", "rlib"]

[dependencies]
rheon = { path = "../..", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.105"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "rheon-solver-reference"
path = "src/bin/reference.rs"
