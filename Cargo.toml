[package]
name = "rheon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Bounded staggered-grid fluid simulation research implementation"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
png = { version = "=0.18.1", optional = true }
rayon = { version = "=1.11.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"], optional = true }

eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[features]
default = ["png-export"]
png-export = ["dep:png"]
parallel = ["dep:rayon"]
work-observation = ["parallel"]
desktop = ["dep:serde", "dep:serde_json", "dep:eframe", "png-export", "parallel", "work-observation"]

[[bin]]
name = "rheon"
path = "src/bin/rheon.rs"
required-features = ["png-export"]

[[bin]]
name = "rheon-desktop"
path = "src/bin/rheon-desktop.rs"
required-features = ["desktop"]

[[example]]
name = "scheduling_lab"
required-features = ["work-observation"]

[[example]]
name = "liquid_step"
required-features = ["png-export"]

[[example]]
name = "free_surface"
required-features = ["png-export"]

[[example]]
name = "column_interface"
required-features = ["png-export"]

[[example]]
name = "viscosity"
required-features = ["png-export"]

[[example]]
name = "column_shear"
required-features = ["png-export"]

[[example]]
name = "column_momentum"
required-features = ["png-export"]

[[example]]
name = "column_mac"
required-features = ["png-export"]

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

# Filesystem import is a native host capability; the browser adapter has no file loader.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
base64 = "=0.22.1"
cap-std = "=3.4.5"
rusqlite = { version = "=0.37.0", features = ["bundled", "limits"] }
sha2 = "=0.10.9"

[[bin]]
name = "rheon-ai-compare"
path = "src/bin/rheon-ai-compare.rs"
required-features = ["desktop"]
