[package]
name = "rheon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Bounded staggered-grid fluid simulation research implementation"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
png = { version = "=0.18.1", optional = true }

[features]
default = ["png-export"]
png-export = ["dep:png"]

[[bin]]
name = "rheon"
path = "src/bin/rheon.rs"
required-features = ["png-export"]
