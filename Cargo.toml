[package]
name = "rheon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Bounded staggered-grid fluid simulation research implementation"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
png = { version = "=0.18.1", optional = true }

eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[features]
default = ["png-export"]
png-export = ["dep:png"]
desktop = ["dep:eframe", "png-export"]

[[bin]]
name = "rheon"
path = "src/bin/rheon.rs"
required-features = ["png-export"]

[[bin]]
name = "rheon-desktop"
path = "src/bin/rheon-desktop.rs"
required-features = ["desktop"]

[[example]]
name = "liquid_step"
required-features = ["png-export"]

[[example]]
name = "free_surface"
required-features = ["png-export"]

[[example]]
name = "column_interface"
required-features = ["png-export"]

[[example]]
name = "viscosity"
required-features = ["png-export"]

[[example]]
name = "column_shear"
required-features = ["png-export"]

[[example]]
name = "column_momentum"
required-features = ["png-export"]

[[example]]
name = "column_mac"
required-features = ["png-export"]
